worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Writable paths for non-root user
    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    # Trust the host-side reverse proxy on the Docker default bridge so
    # $remote_addr resolves to the real client instead of 172.17.0.1
    set_real_ip_from  172.17.0.0/16;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    log_format json_combined escape=json
        '{'
            '"time":"$time_iso8601",'
            '"remote_addr":"$remote_addr",'
            '"host":"$host",'
            '"method":"$request_method",'
            '"uri":"$request_uri",'
            '"status":$status,'
            '"bytes_sent":$body_bytes_sent,'
            '"request_time":$request_time,'
            '"referer":"$http_referer",'
            '"ua":"$http_user_agent",'
            '"xff":"$http_x_forwarded_for"'
        '}';
    access_log /dev/stdout json_combined;

    # Hashed-asset requests are noisy and uninformative when they succeed; keep
    # only 4xx/5xx so a broken deploy or a missing chunk is still visible
    map $status $log_asset_error {
        ~^[45] 1;
        default 0;
    }

    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    server_tokens off;
    keepalive_timeout 65;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    server {
        listen 5000;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Hashed assets emitted by Vue CLI under /js, /css, /img, /fonts — safe to cache forever
        location ~* ^/(js|css|img|fonts)/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log /dev/stdout json_combined if=$log_asset_error;
            try_files $uri =404;
        }

        # index.html must never be stale, otherwise clients keep loading old bundle hashes
        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        # SPA fallback: any unmatched path serves index.html so Vue Router can take over
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
